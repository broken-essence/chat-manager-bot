version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bot:
    build: .
    container_name: chat-manager-bot
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/users
      DB_USER: postgres
      DB_PASSWORD: postgres
      CONFIG_FILE: "local.config.json"
    restart: always

volumes:
  pgdata:
